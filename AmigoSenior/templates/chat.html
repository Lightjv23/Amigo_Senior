<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot com Groq</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Chatbot Groq</h1>
            <p>Powered by Llama-3.3-70b-versatile</p>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        // Gera um ID de sessão simples (pode ser armazenado em localStorage)
        let sessionId = localStorage.getItem('chat_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_session_id', sessionId);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessage(role, content, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Carregar histórico ao iniciar
        async function loadHistory() {
            try {
                const response = await fetch('/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const data = await response.json();
                if (data.history && data.history.length > 0) {
                    // Limpar mensagens existentes (se houver alguma padrão)
                    chatMessages.innerHTML = '';
                    data.history.forEach(msg => {
                        addMessage(msg.role, msg.content, msg.timestamp);
                    });
                } else {
                    // Mensagem de boas-vindas padrão se não houver histórico
                    addMessage('assistant', 'Olá! Sou um chatbot usando a API do Groq. Como posso ajudá-lo hoje?');
                }
            } catch (error) {
                console.error('Erro ao carregar histórico:', error);
                addMessage('assistant', 'Olá! Sou um chatbot usando a API do Groq. Como posso ajudá-lo hoje?');
            }
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // Exibir mensagem do usuário imediatamente
            addMessage('user', message);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            // Indicador de digitação
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant typing';
            typingDiv.innerHTML = '<div class="message-content">Digitando<span>.</span><span>.</span><span>.</span></div>';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            try {
                const response = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, session_id: sessionId })
                });
                const data = await response.json();
                if (data.response) {
                    // Remover indicador de digitação
                    typingDiv.remove();
                    addMessage('assistant', data.response);
                } else {
                    throw new Error('Resposta inválida');
                }
            } catch (error) {
                typingDiv.remove();
                addMessage('assistant', 'Desculpe, ocorreu um erro. Tente novamente.');
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Carregar histórico quando a página carregar
        window.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
